[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eneas*"]
exclude = ["examples*"]

[project]
name = "eneas"
version = "0.1.0"
description = "ENEAS: Embedding-guided Neural Ensemble for Adaptive Segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "SperidLabs", email = "team@speridlabs.com"}
]
keywords = ["segmentation", "frames", "tracking", "computer-vision", "SeC", "frame-analysis", "object-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.23.0",
    "transformers>=4.53.0,<4.54.0",
    "numpy>=1.24.0,<2.0.0",
    "opencv-python>=4.8.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0,<2.0.0",
    "iopath>=0.1.10",
    "timm>=0.9.0,<2.0.0",
    "einops>=0.6.0",
    "accelerate>=0.20.0",
    "deepspeed>=0.9.0",
    "peft>=0.5.0",
    "typer>=0.9.0",
    "click>=8.1.0",
    "spacy==3.8.11",
    "thinc==8.3.10",
    "inflect>=6.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=3.20.0",
    "sam2",
    "ollama",
    "pydantic",
    "decord",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
ui = [
    "gradio",
    "spaces",
    "python-dotenv>=1.2.1",
]

dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]


[project.scripts]
eneas = "eneas.cli:main"

[project.urls]
Homepage = "https://github.com/speridlabs/eneas"
Repository = "https://github.com/speridlabs/eneas"
Documentation = "https://github.com/speridlabs/eneas#readme"
Issues = "https://github.com/speridlabs/eneas/issues"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[tool.uv]
prerelease = "allow" 
config-settings = { "build_option" = "--compute_capabilities=120" }

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "matplotlib.*",
    "PIL.*",
    "transformers.*",
    "hydra.*",
    "iopath.*",
    "timm.*",
]
ignore_missing_imports = true
